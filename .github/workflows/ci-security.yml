name: CI Security

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        required: false

jobs:
  dependency-review:
    name: dependency-review
    if: github.base_ref == 'staging' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scanning:
    name: secret-scanning
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via GET /pulls/{n}/commits. Public repos answer
    # that unauthenticated; private repos need pull-requests: read (issue #35). A called
    # workflow cannot raise the caller's token, so private callers with the restricted default
    # token must also grant it on the calling job (see README).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
